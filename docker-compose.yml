# .env: Compose ${VAR} yerleştirmesi + env_file. Dosya docker-compose.yml ile aynı dizinde olmalı.

services:
  superset:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: superset_firefox
    container_name: superset_app
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY_is_unset}"
      SUPERSET_DATABASE_URI: "sqlite:////app/superset_home/superset.db"
      FEATURE_FLAGS_ALERT_REPORTS: "true"
      ALERT_REPORTS_LOG_RETENTION: "7"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_is_unset}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_is_unset}@redis:6379/0"
      WEBDRIVER_TYPE: "firefox"
    ports:
      - "8088:8088"
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset init &&
        superset fab create-admin --username admin --firstname Superset --lastname Admin --email murat.akpinar@muratakpinar.com.tr --password admin &&
        superset run -h 0.0.0.0 -p 8088
    volumes:
      - ./execute.py:/app/superset/commands/report/execute.py
      - ./scheduler.py:/app/superset/tasks/scheduler.py
      - ./superset/superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - superset-network

  redis:
    image: redis:latest
    container_name: redis
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD_is_unset}"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD_is_unset}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - superset-network

  celery-worker:
    image: superset_firefox
    container_name: celery_worker
    env_file:
      - .env
    environment:
      WEBDRIVER_TYPE: "firefox"
      SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_is_unset}@redis:6379/0"
      SUPERSET_DATABASE_URI: "sqlite:////app/superset_home/superset.db"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_is_unset}@redis:6379/0"
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY_is_unset}"
      CELERY_BROKER_TRANSPORT_OPTIONS: '{"visibility_timeout": 3600, "retry_on_startup": true}'
    volumes:
      - ./execute.py:/app/superset/commands/report/execute.py
      - ./scheduler.py:/app/superset/tasks/scheduler.py      
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/superset_home:/app/superset_home
    command:
      - /bin/sh
      - -c
      - |
        celery --app=superset.tasks.celery_app:app worker --pool=prefork --max-tasks-per-child=128 -Q email_reports,celery --loglevel=DEBUG
    depends_on:
      redis:
        condition: service_healthy
      superset:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app=superset.tasks.celery_app:app inspect ping -t 10 || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - superset-network

  celery-beat:
    image: superset_firefox
    container_name: celery_beat
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_is_unset}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_is_unset}@redis:6379/0"
      SUPERSET_DATABASE_URI: "sqlite:////app/superset_home/superset.db"
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY_is_unset}"
      WEBDRIVER_TYPE: "firefox"
    volumes:
      - ./execute.py:/app/superset/commands/report/execute.py
      - ./scheduler.py:/app/superset/tasks/scheduler.py
      - ./superset/superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py
    command:
      - /bin/sh
      - -c
      - |
        celery --app=superset.tasks.celery_app:app beat --pidfile /tmp/celerybeat.pid --schedule /tmp/celerybeat-schedule --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - superset-network

networks:
  superset-network:
    driver: bridge
